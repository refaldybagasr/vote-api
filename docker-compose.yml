services:
  mongo:
    image: mongo:8.0.34
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
        try {
          rs.status();
        } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] });
        }
        db.adminCommand({ ping: 1 }).ok === 1 ? quit(0) : quit(1);
        "
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
